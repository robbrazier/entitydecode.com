on:
  pull_request:

concurrency:
  group: build-${{ forgejo.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: forgejo.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: build
        run: npm run build
