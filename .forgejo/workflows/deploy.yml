on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ forgejo.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: deploy
        run: npm run deploy
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
