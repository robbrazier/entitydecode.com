when:
  - branch: main
    event: push

steps:
  - name: build
    image: ghcr.io/pnpm/pnpm:11
    when:
      - event: push
    commands:
      - pnpm install
      - pnpm run build
  - name: deploy
    image: node:lts-alpine
    when:
      - event: push
    environment:
      BUNNYNET_API_KEY:
        from_secret: BUNNYNET_API_KEY
    commands:
      - npm run deploy
